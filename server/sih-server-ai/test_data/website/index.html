<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechMart - Laptop Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 18px 40px;
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        .search-area {
            display: flex;
            flex: 1;
            max-width: 700px;
        }

        #search {
            flex: 1;
            padding: 13px;
            border: none;
            font-size: 16px;
        }

        #search-button {
            padding: 13px 25px;
            border: none;
            background: #f59e0b;
            cursor: pointer;
            font-weight: bold;
        }

        #search-button:hover {
            background: #d97706;
        }

        .cart {
            font-size: 18px;
            cursor: pointer;
        }

        main {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 25px;
        }

        h1 {
            margin-bottom: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .product {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .product-image {
            height: 160px;
            background: #e5e7eb;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
            margin-bottom: 15px;
        }

        .product h2 {
            font-size: 19px;
            margin: 10px 0;
        }

        .price {
            font-size: 22px;
            font-weight: bold;
            margin: 15px 0;
        }

        .buy-button {
            width: 100%;
            padding: 11px;
            border: none;
            background: #2563eb;
            color: white;
            cursor: pointer;
            border-radius: 5px;
        }

        .buy-button:hover {
            background: #1d4ed8;
        }

        .account {
            margin-top: 40px;
            background: white;
            padding: 25px;
            border-radius: 8px;
        }

        .account input {
            display: block;
            width: 350px;
            max-width: 100%;
            margin: 10px 0;
            padding: 10px;
        }

        .login-button {
            padding: 10px 25px;
            border: none;
            background: #16a34a;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        TechMart
    </div>

    <div class="search-area">

        <input
            id="search"
            type="text"
            placeholder="Search laptops, phones, accessories..."
            aria-label="Search products"
        >

        <button
            id="search-button"
            type="button"
            aria-label="Search"
        >
            Search
        </button>

    </div>

    <div
        class="cart"
        role="button"
        aria-label="Shopping cart"
        tabindex="0"
    >
        🛒 Cart
    </div>

</header>


<main>

    <h1>Featured Laptops</h1>

    <div class="products">

        <article class="product">

            <div class="product-image">
                💻
            </div>

            <h2>ASUS TUF Gaming A15</h2>

            <p>Ryzen 7 · RTX 4060 · 16GB RAM</p>

            <div class="price">
                ₹79,999
            </div>

            <button
                id="product-asus-tuf"
                class="buy-button"
                aria-label="Buy ASUS TUF Gaming A15"
            >
                Add to Cart
            </button>

        </article>


        <article class="product">

            <div class="product-image">
                💻
            </div>

            <h2>Lenovo Legion 5</h2>

            <p>Ryzen 7 · RTX 4060 · 16GB RAM</p>

            <div class="price">
                ₹89,999
            </div>

            <button
                id="product-legion"
                class="buy-button"
                aria-label="Buy Lenovo Legion 5"
            >
                Add to Cart
            </button>

        </article>


        <article class="product">

            <div class="product-image">
                💻
            </div>

            <h2>HP Victus 15</h2>

            <p>Core i5 · RTX 4050 · 16GB RAM</p>

            <div class="price">
                ₹74,999
            </div>

            <button
                id="product-victus"
                class="buy-button"
                aria-label="Buy HP Victus 15"
            >
                Add to Cart
            </button>

        </article>

    </div>


    <!-- This section deliberately contains sensitive information. -->

    <section class="account">

        <h2>Account Login</h2>

        <label for="email">
            Email
        </label>

        <input
            id="email"
            type="email"
            autocomplete="email"
            placeholder="Email address"
        >

        <label for="password">
            Password
        </label>

        <input
            id="password"
            type="password"
            autocomplete="current-password"
        >

        <button
            id="login"
            class="login-button"
            type="button"
        >
            Login
        </button>

    </section>

</main>

</body>
</html>
